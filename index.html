<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Style Swipe</title>
<style>
:root{--esp:#3B2A21;--camel:#B98A5B;--ivory:#F6F1EA;--muted:#8A7B6E;--ink:#2B211B;--gold:#C9A45C;--line:#E6DDD2}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--ivory);color:var(--ink);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--esp);color:#fff;position:sticky;top:0;z-index:20}
header h1{font-family:Georgia,serif;font-weight:400;font-size:20px;margin:0}
nav{display:flex;gap:6px}
nav button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 12px;border-radius:20px;font-size:13px;cursor:pointer}
nav button.on{background:#fff;color:var(--esp)}
.count{display:inline-block;background:var(--gold);color:var(--esp);border-radius:10px;padding:0 6px;margin-left:4px;font-size:11px;font-weight:700}
main{max-width:1060px;margin:0 auto;padding:12px}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin:2px 0 10px}
.filters .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted)}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--esp);border-color:var(--esp);color:#fff}
.sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.deck{position:relative;width:min(390px,94vw);height:640px;margin:0 auto}
.card{position:absolute;inset:0;background:#fff;border-radius:22px;box-shadow:0 10px 30px rgba(59,42,33,.14);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;transition:transform .3s ease,opacity .3s ease}
.card.dragging{transition:none}
.photo{height:400px;background:#EFE8DF;position:relative;overflow:hidden;flex:none}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;pointer-events:none;-webkit-user-drag:none}
.ogrid{display:grid;gap:2px;height:100%;grid-template-columns:1fr 1fr;grid-auto-rows:1fr}
.ogrid.n3 .tile:first-child{grid-row:span 2}
.ogrid.n5{grid-template-columns:1fr 1fr 1fr}.ogrid.n5 .tile:first-child{grid-row:span 2}
.tile{position:relative;overflow:hidden;background:#EFE8DF;cursor:pointer}
.tile .chk{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.9);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.tile.sel .chk{background:#2f7a4f}
.tile.sel{outline:3px solid #2f7a4f;outline-offset:-3px}
.fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-family:Georgia,serif;color:#fff;font-size:15px}
.badge{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.93);border-radius:12px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--esp);z-index:2}
.stamp{position:absolute;top:20px;padding:6px 14px;border:3px solid;border-radius:8px;font-weight:800;font-size:22px;letter-spacing:2px;opacity:0;background:rgba(255,255,255,.85);z-index:3;pointer-events:none}
.stamp.yes{left:18px;color:#2f7a4f;border-color:#2f7a4f;transform:rotate(-12deg)}
.stamp.no{right:18px;color:#a23b3b;border-color:#a23b3b;transform:rotate(12deg)}
.info{padding:11px 15px 13px;flex:1;display:flex;flex-direction:column;gap:5px;min-height:0}
.info h2{font-family:Georgia,serif;font-weight:400;font-size:18px;margin:0;line-height:1.2}
.brand{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;background:var(--ivory);border-radius:10px;padding:2px 8px;color:var(--muted)}
.why{font-size:13px;color:#5A4A3E;line-height:1.35}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-top:auto}
.meta b{color:var(--esp)} .meta a{color:var(--camel);font-weight:700;text-decoration:none}
.oactions{display:flex;gap:8px;margin-top:auto}
.oactions button{flex:1;border-radius:14px;padding:10px 6px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--esp)}
.oactions .all{background:var(--esp);color:#fff}.oactions .some{background:#fff;color:var(--esp)}
.oactions .some:disabled{opacity:.4}
.controls{display:flex;justify-content:center;gap:18px;margin:14px 0 6px}
.controls button{width:60px;height:60px;border-radius:50%;border:none;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.1);font-size:25px;cursor:pointer}
.controls .undo{width:48px;height:48px;font-size:20px;align-self:center;color:var(--gold)}
.controls .no{color:#a23b3b}.controls .yes{color:#2f7a4f}
.hint{text-align:center;color:var(--muted);font-size:12px;max-width:560px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--esp);color:#fff;padding:9px 16px;border-radius:18px;font-size:13px;opacity:0;transition:opacity .25s;z-index:50;pointer-events:none}
.toast.on{opacity:1}
.subnav{display:flex;gap:8px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.wcard{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(59,42,33,.08);display:flex;flex-direction:column}
.wcard .ph{height:220px;background:#EFE8DF}.wcard .ph img{width:100%;height:100%;object-fit:cover;object-position:center top}
.wcard .ph .ogrid{height:100%}
.wcard .b{padding:9px 11px;font-size:13px;display:flex;flex-direction:column;gap:4px;flex:1}
.wcard strong{font-family:Georgia,serif;font-weight:400;font-size:15px}
.wcard .row{display:flex;justify-content:space-between;margin-top:auto;align-items:center;gap:6px;flex-wrap:wrap}
.wcard a{color:var(--camel);font-weight:700;text-decoration:none}
.wcard button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0}
.wcard button.split{color:var(--esp);font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}
.btn{border:1px solid var(--esp);background:#fff;color:var(--esp);border-radius:18px;padding:7px 13px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-block}
.btn.dark{background:var(--esp);color:#fff}
.sync{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 4px 14px rgba(59,42,33,.08);font-size:13px}
.sync input{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;margin:8px 0;font-size:13px}
.sync .st{font-weight:600}
.empty{text-align:center;color:var(--muted);padding:50px 0}
.board{background:#fff;border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 4px 14px rgba(59,42,33,.08)}
.board h3{font-family:Georgia,serif;font-weight:400;font-size:24px;margin:0 0 4px}
.board p{margin:0 0 12px;color:#5A4A3E;font-size:14px}
.collage{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;gap:6px;grid-auto-flow:dense}
.collage a{display:block;border-radius:10px;overflow:hidden;background:#EFE8DF;text-decoration:none}
.collage img{width:100%;height:100%;object-fit:cover;object-position:center top}
.collage .big{grid-row:span 2;grid-column:span 2}.collage .tall{grid-row:span 2}
.collage .word{display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:19px;color:#fff;text-align:center;padding:10px;border-radius:10px;grid-column:span 2}
.swatches{display:flex;gap:6px;margin:12px 0 8px}.swatches i{flex:1;height:22px;border-radius:6px}
.links a{color:var(--camel);font-weight:700;font-size:14px;text-decoration:none;margin-right:16px}
.mode{display:flex;gap:8px;margin-bottom:12px}.mode button{flex:1;padding:12px;border-radius:14px;border:1px solid var(--esp);background:#fff;color:var(--esp);font-weight:600;font-size:14px;cursor:pointer}.mode button.on{background:var(--esp);color:#fff}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.pickgrid .tile{height:150px;border-radius:12px}
.pickgrid .tile .lab{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);font-size:11px;padding:4px 6px;line-height:1.2}
.panel{background:#fff;border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(59,42,33,.08);margin-bottom:14px}
.panel h4{font-family:Georgia,serif;font-weight:400;font-size:20px;margin:0 0 6px}
.panel .prev{height:260px;border-radius:12px;overflow:hidden;margin:10px 0;background:#EFE8DF}
.panel input[type=text]{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;font-size:14px;margin:6px 0}
.sugg{position:absolute;left:6px;top:6px;background:var(--gold);color:var(--esp);font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px;z-index:2}
.why2{font-size:13px;color:#5A4A3E;line-height:1.4;margin:6px 0}
.tog{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
@media (max-width:600px){.filters{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:4px}.collage{grid-template-columns:repeat(2,1fr);grid-auto-rows:130px}.photo{height:370px}.deck{height:620px}nav button{padding:6px 9px;font-size:12px}}
</style>
</head>
<body>
<header><h1>Style Swipe</h1>
<nav><button data-view="swipe" class="on">Swipe</button><button data-view="wish">Saved<span class="count" id="wcount">0</span></button><button data-view="boards">Moodboards</button></nav></header>
<main>
<section id="v-swipe">
  <div class="filters" id="filters"></div>
  <div class="deck" id="deck"></div>
  <div class="controls"><button class="no" id="bNo" title="Pass">✕</button><button class="undo" id="bUndo" title="Back">↶</button><button class="yes" id="bYes" title="Love it">♥</button></div>
  <div class="hint">Swipe right or ♥ to save. On outfit cards, tap photos to pick single pieces, then "Save selected", or save the whole outfit. ↶ undoes your last move.</div>
</section>
<section id="v-wish" hidden>
  <div class="sync" id="sync"></div>
  <div class="subnav"><button class="chip on" data-sub="pieces">Pieces</button><button class="chip" data-sub="outfits">Outfits</button></div>
  <div class="bar" id="wbar"><div id="wsum"></div><div style="display:flex;gap:8px"><button class="btn" id="bCopy">Copy list</button><button class="btn" id="bClear">Clear</button></div></div>
  <div class="grid2" id="wgrid"></div><div id="create"></div>
</section>
<section id="v-boards" hidden></section>
<div class="note">Photos, prices and links come from each store's own site (mostly Quince, plus FAITHFULL). Check stock in your size before buying.</div>
</main>
<div class="toast" id="toast"></div>

const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let wish=LS.get('ss3_wish',null);
if(!wish){ const old=LS.get('ss2_wish',[]); wish=old.map(id=>({id,from:'Single piece',date:today()})); }
let outfits=LS.get('ss3_outfits',[]), seen=new Set(LS.get('ss3_seen',[])), filt=LS.get('ss3_filt',{v:[],c:[],k:[],acc:true}), learn=LS.get('ss3_learn',LS.get('ss2_learn',{}));
if(filt.acc===undefined) filt.acc=true;
let syncUrl=LS.get('ss3_sync',''), history=[], queue=[], n=0, sub='pieces';
const $=s=>document.querySelector(s), pick=a=>a[Math.floor(Math.random()*a.length)];
function today(){ return new Date().toISOString().slice(0,10); }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),1600); }

// ---------- Google Sheet sync ----------
function post(payload){ if(!syncUrl) return; try{ fetch(syncUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)}).catch(()=>{}); }catch(e){} }
function pieceRow(p,from,date){ return [`=IMAGE("${p.img}")`,p.name,p.brand,CATS[p.cat],CNAME[p.col]||p.col,p.vibes.map(v=>VIBES[v]).join(', '),SIZE[p.cat],p.price,`=HYPERLINK("${p.url}","Shop")`,from,date,'Want',p.id]; }
function syncAddPiece(w){ const p=byId(w.id); if(p) post({tab:'Pieces',action:'add',id:p.id,row:pieceRow(p,w.from,w.date)}); }
function syncRemovePiece(id){ post({tab:'Pieces',action:'remove',id}); }
function outfitRow(o){ const ps=o.parts.map(byId).filter(Boolean); return [o.name,VIBES[o.vibe]||'',ps.map(p=>p.name).join(' + '),ps.reduce((s,p)=>s+p.price,0),ps.map(p=>p.url).join('  '),o.date,o.oid]; }
function syncAddOutfit(o){ post({tab:'Outfits',action:'add',id:o.oid,row:outfitRow(o)}); o.parts.forEach(id=>{ const p=byId(id); if(p) post({tab:'Pieces',action:'add',id:p.id,row:pieceRow(p,'Outfit: '+o.name,o.date)}); }); }
function syncRemoveOutfit(o){ post({tab:'Outfits',action:'remove',id:o.oid}); o.parts.forEach(id=>{ if(!wish.some(w=>w.id===id) && !outfits.some(x=>x.oid!==o.oid&&x.parts.includes(id))) syncRemovePiece(id); }); }

// ---------- deck ----------
function passes(p){ return (!filt.v.length||p.vibes.some(v=>filt.v.includes(v))) && (!filt.c.length||p.cities.some(c=>filt.c.includes(c))) && (!filt.k.length||filt.k.includes(p.cat)); }
function weight(p){ let w=1; p.vibes.forEach(v=>w+=(learn['v_'+v]||0)*0.35); w+=(learn['c_'+p.col]||0)*0.5; w+=(learn['k_'+p.cat]||0)*0.2; return Math.max(0.15,w); }
function wpick(arr){ const t=arr.reduce((s,p)=>s+weight(p),0); let r=Math.random()*t; for(const p of arr){ r-=weight(p); if(r<=0) return p; } return arr[0]; }
function nextProduct(){ let pool=P.filter(p=>passes(p)&&!seen.has(p.id)&&!queue.some(q=>q.kind==='item'&&q.p.id===p.id));
  if(!pool.length){ P.filter(passes).forEach(p=>seen.delete(p.id)); pool=P.filter(p=>passes(p)&&!queue.some(q=>q.kind==='item'&&q.p.id===p.id)); }
  if(!pool.length) return null; const p=wpick(pool); seen.add(p.id); return {key:'i'+(n++),kind:'item',p}; }
const NEUTRAL=['black','chocolate','espresso','camel','ivory','taupe','sand','khaki','gold'];
const harm=(a,b)=>a===b||NEUTRAL.includes(a)||NEUTRAL.includes(b);
const NAMES={ql:['Gallery morning','Soho lunch','Quiet Sunday','Upper East errands','Hotel lobby'],mo:['Casting call','Off-duty coffee','West Village walk','Melrose afternoon','Studio day'],med:['Miami sunset','Beach club lunch','Amalfi in Miami','Linen day','Golden hour'],n90:['Dinner downtown','Gallery opening','Late reservation','Evening in black','Rooftop drinks']};
function makeOutfit(){
  const base=P.filter(p=>!filt.c.length||p.cities.some(c=>filt.c.includes(c)));
  const ks=Object.keys(VIBES); const vibe=filt.v.length?pick(filt.v):ks.reduce((b,k)=>((learn['v_'+k]||0)+Math.random()*2>(learn['v_'+b]||0)+Math.random()*2?k:b),ks[0]);
  const pool=base.filter(p=>p.vibes.includes(vibe)), of=c=>pool.filter(p=>p.cat===c);
  let parts=[]; const dress=of('dress');
  if(dress.length&&Math.random()<0.3) parts=[wpick(dress)];
  else{ const tops=of('top').concat(of('knit')), bots=of('bottom').concat(of('skirt')); if(!tops.length||!bots.length) return null; const t=wpick(tops); const bo=bots.filter(b=>harm(b.col,t.col)); parts=[t,wpick(bo.length?bo:bots)]; }
  const fits=arr=>arr.filter(x=>parts.every(y=>harm(y.col,x.col)));
  const outer=fits(of('outer')); if(outer.length&&Math.random()<0.5) parts.push(wpick(outer));
  const shoes=fits(of('shoe')); if(shoes.length) parts.push(wpick(shoes)); else if(of('shoe').length) parts.push(wpick(of('shoe')));
  if(filt.acc){ const acc=fits(of('acc').concat(of('bag'))); if(acc.length) parts.push(wpick(acc)); }
  parts=parts.slice(0,5);
  return {key:'o'+(n++),kind:'outfit',vibe,parts,name:pick(NAMES[vibe]),sel:new Set()};
}
function fill(){ while(queue.length<3){ const it=(n%4===3&&!filt.k.length)?(makeOutfit()||nextProduct()):nextProduct(); if(!it){n++; if(n>3000)break; continue;} queue.push(it);} LS.set('ss3_seen',[...seen]); }

const esc=t=>String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function fb(img){ if(!img.dataset.retry&&img.src.includes('?')){img.dataset.retry=1;img.src=img.src.split('?')[0];return;} const d=document.createElement('div'); d.className='fallback'; d.style.background=COLORS[img.dataset.col]||'#8C7A6A'; d.textContent=img.alt; img.replaceWith(d); }
function imgTag(p){ return `<img src="${esc(p.img)}" alt="${esc(p.name)}" data-col="${p.col}" loading="lazy" referrerpolicy="no-referrer" onerror="fb(this)">`; }
function gridHTML(ps,selectable,sel){ return `<div class="ogrid n${ps.length}">${ps.map(p=>`<div class="tile ${sel&&sel.has(p.id)?'sel':''}" data-pid="${p.id}">${imgTag(p)}${selectable?'<span class="chk">✓</span>':''}</div>`).join('')}</div>`; }
function cardHTML(it){
  if(it.kind==='item'){ const p=it.p;
    return `<div class="photo">${imgTag(p)}<div class="badge">${CATS[p.cat]}</div></div><div class="stamp yes">SAVE</div><div class="stamp no">PASS</div>
    <div class="info"><div class="brand">${p.brand}</div><h2>${p.name}</h2>
    <div class="tags">${p.vibes.map(v=>`<span class="tag">${VIBES[v]}</span>`).join('')}${p.cities.map(c=>`<span class="tag">${CITIES[c]}</span>`).join('')}</div>
    <div class="why">${CWHY[p.col]||''} ${KWHY[p.cat]||''}</div>
    <div class="meta"><span>Your size <b>${SIZE[p.cat]}</b> · $${p.price.toFixed(0)}</span><a href="${p.url}" target="_blank" rel="noopener">Shop ↗</a></div></div>`; }
  const ps=it.parts, tot=ps.reduce((s,p)=>s+p.price,0);
  return `<div class="photo">${gridHTML(ps,true,it.sel)}<div class="badge">Outfit · ${VIBES[it.vibe]}</div></div><div class="stamp yes">SAVE</div><div class="stamp no">PASS</div>
   <div class="info"><div class="brand">“${it.name}” · ${ps.length} pieces · $${tot.toFixed(0)}</div>
   <div class="why" style="font-size:12.5px">${ps.map((p,i)=>`<a href="${p.url}" target="_blank" rel="noopener" style="color:var(--ink);text-decoration:none">${i+1}. ${p.name} <span style="color:var(--camel)">$${p.price.toFixed(0)} ↗</span></a>`).join('<br>')}</div>
   <div class="oactions"><button class="all" data-act="all">♥ Save outfit</button><button class="some" data-act="some" ${it.sel.size?'':'disabled'}>Save selected (${it.sel.size})</button></div></div>`;
}
function render(){ fill(); const deck=$('#deck'); deck.innerHTML='';
  if(!queue.length){ deck.innerHTML='<div class="empty">Nothing matches these filters. Turn one off.</div>'; return; }
  queue.slice(0,2).reverse().forEach((it,i,arr)=>{ const top=i===arr.length-1; const el=document.createElement('div'); el.className='card'; el.dataset.key=it.key;
    if(!top){el.style.transform='scale(.95) translateY(12px)';el.style.opacity='.6';}
    el.innerHTML=cardHTML(it); deck.appendChild(el); if(top) wire(el,it); }); }
function wire(el,it){ let sx=0,sy=0,dx=0,on=false,moved=false;
  el.addEventListener('pointerdown',e=>{ if(e.target.closest('a,button'))return; on=true; moved=false; sx=e.clientX; sy=e.clientY; dx=0; el.classList.add('dragging'); });
  el.addEventListener('pointermove',e=>{ if(!on)return; dx=e.clientX-sx; if(Math.abs(dx)>8){moved=true; try{el.setPointerCapture(e.pointerId)}catch(_){} } if(!moved)return; el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`; el.querySelector('.stamp.yes').style.opacity=Math.max(0,dx/100); el.querySelector('.stamp.no').style.opacity=Math.max(0,-dx/100); });
  const end=e=>{ if(!on)return; on=false; el.classList.remove('dragging');
    if(moved&&dx>100) decide(true); else if(moved&&dx<-100) decide(false);
    else { el.style.transform=''; el.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0);
      if(!moved&&it.kind==='outfit'){ const t=e.target.closest('.tile'); if(t){ const id=t.dataset.pid; it.sel.has(id)?it.sel.delete(id):it.sel.add(id); t.classList.toggle('sel'); const b=el.querySelector('[data-act=some]'); b.disabled=!it.sel.size; b.textContent=`Save selected (${it.sel.size})`; } } } };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',()=>{on=false;el.classList.remove('dragging');el.style.transform='';});
  el.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); if(b.dataset.act==='all') decide(true); else decide(true,true); })); }
function itemsOf(it){ return it.kind==='item'?[it.p]:it.parts; }
function bump(ps,d){ ps.forEach(p=>{ p.vibes.forEach(v=>learn['v_'+v]=(learn['v_'+v]||0)+d); learn['c_'+p.col]=(learn['c_'+p.col]||0)+d; learn['k_'+p.cat]=(learn['k_'+p.cat]||0)+d; }); LS.set('ss3_learn',learn); }
function decide(like,selectedOnly){ const it=queue[0]; if(!it)return; const el=document.querySelector(`.card[data-key="${it.key}"]`);
  if(el){el.style.transform=`translateX(${like?650:-650}px) rotate(${like?30:-30}deg)`;el.style.opacity='0';}
  queue.shift(); const h={it,like,addedPieces:[],addedOutfit:null};
  if(like){
    if(it.kind==='item'){ if(!wish.some(w=>w.id===it.p.id)){ const w={id:it.p.id,from:'Single piece',date:today()}; wish.push(w); h.addedPieces.push(w.id); syncAddPiece(w);} bump([it.p],1); toast('Saved to Pieces'); }
    else if(selectedOnly){ const ps=it.parts.filter(p=>it.sel.has(p.id)); ps.forEach(p=>{ if(!wish.some(w=>w.id===p.id)){ const w={id:p.id,from:'From outfit “'+it.name+'”',date:today()}; wish.push(w); h.addedPieces.push(p.id); syncAddPiece(w);} }); bump(ps,1); toast(`Saved ${ps.length} piece${ps.length>1?'s':''}`); }
    else { const o={oid:'o'+Date.now(),name:it.name,vibe:it.vibe,parts:it.parts.map(p=>p.id),date:today()}; outfits.push(o); h.addedOutfit=o; syncAddOutfit(o); bump(it.parts,1); toast('Outfit saved'); }
  } else bump(itemsOf(it),-0.3);
  history.push(h); save(); setTimeout(render,220); }
function undo(){ const h=history.pop(); if(!h)return;
  if(h.like){ wish=wish.filter(w=>!h.addedPieces.includes(w.id)); h.addedPieces.forEach(syncRemovePiece);
    if(h.addedOutfit){ outfits=outfits.filter(o=>o.oid!==h.addedOutfit.oid); syncRemoveOutfit(h.addedOutfit);} bump(itemsOf(h.it),-1); }
  else bump(itemsOf(h.it),0.3);
  if(h.it.kind==='outfit') h.it.sel=new Set(); queue.unshift(h.it); save(); render(); toast('Undone'); }
function save(){ LS.set('ss3_wish',wish); LS.set('ss3_outfits',outfits); $('#wcount').textContent=wish.length+outfits.length; }

function renderFilters(){ const f=$('#filters'); const grp=(t,obj)=>Object.entries(obj).map(([k,v])=>`<button class="chip ${filt[t].includes(k)?'on':''}" data-t="${t}" data-k="${k}">${v}</button>`).join('');
  f.innerHTML=`<span class="lbl">Vibe</span>${grp('v',VIBES)}<span class="sep"></span><span class="lbl">City</span>${grp('c',CITIES)}<span class="sep"></span><button class="chip ${filt.acc?'on':''}" id="accT">＋ Accessories in outfits</button><span class="sep"></span><span class="lbl">Type</span>${grp('k',CATS)}`;
  f.querySelectorAll('.chip[data-t]').forEach(b=>b.onclick=()=>{ const a=filt[b.dataset.t],k=b.dataset.k; a.includes(k)?a.splice(a.indexOf(k),1):a.push(k); LS.set('ss3_filt',filt); renderFilters(); queue=[]; render(); });
  $('#accT').onclick=()=>{ filt.acc=!filt.acc; LS.set('ss3_filt',filt); renderFilters(); queue=[]; render(); }; }

function renderSync(){ $('#sync').innerHTML=`<div><b>Google Sheet</b> · <a class="btn dark" style="padding:4px 10px;font-size:12px" href="${SHEET_URL}" target="_blank" rel="noopener">Open my sheet ↗</a></div>
  <div style="margin-top:6px;color:#5A4A3E">${syncUrl?'<span class="st" style="color:#2f7a4f">Auto-sync is on.</span> Everything you save or undo updates the sheet.':'Auto-sync is off. Do the one-time setup in the sheet\'s “Auto-sync setup” tab, then paste the Web app URL here:'}</div>
  <input id="syncIn" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(syncUrl)}">

function renderWish(){ renderSync(); document.querySelectorAll('[data-sub]').forEach(b=>b.classList.toggle('on',b.dataset.sub===sub||(sub==='create'&&b.dataset.sub==='outfits'))); const g=$('#wgrid'); $('#create').innerHTML=''; $('#wbar').style.display=sub==='create'?'none':''; g.style.display=sub==='create'?'none':'';
  if(sub==='create'){ renderCreate(); return; }

    $('#wsum').innerHTML=`<b>${items.length}</b> pieces · <b>$${items.reduce((s,x)=>s+x.p.price,0).toLocaleString(undefined,{maximumFractionDigits:0})}</b>`;
    g.innerHTML=items.map(({w,p})=>`<div class="wcard"><div class="ph">${imgTag(p)}</div><div class="b"><span class="brand">${p.brand} · ${CATS[p.cat]}</span><strong>${p.name}</strong><span style="color:var(--muted)">Size ${SIZE[p.cat]} · $${p.price.toFixed(0)}</span><span style="color:var(--muted);font-size:11px">${esc(w.from)}</span><div class="row"><a href="${p.url}" target="_blank" rel="noopener">Shop ↗</a><button data-rm="${p.id}">Remove</button></div></div></div>`).join('');
    g.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ wish=wish.filter(w=>w.id!==b.dataset.rm); syncRemovePiece(b.dataset.rm); save(); renderWish(); });
  } else { $('#wsum').innerHTML=`<button class="btn dark" id="makeBtn" style="font-size:14px;padding:9px 16px">＋ Make outfits</button> ${outfits.length?`<span style="margin-left:6px"><b>${outfits.length}</b> outfits</span>`:''}`;
    $('#makeBtn').onclick=()=>{ sub='create'; cmode=null; proposals=[]; renderWish(); };
    if(!outfits.length){ g.innerHTML='<div class="empty" style="grid-column:1/-1">No outfits yet. Tap “＋ Make outfits”, or use “Save outfit” on an outfit card while swiping.</div>'; return; }
    g.innerHTML=outfits.map(o=>{ const ps=o.parts.map(byId).filter(Boolean); return `<div class="wcard"><div class="ph">${gridHTML(ps,false)}</div><div class="b"><span class="brand">${VIBES[o.vibe]||''}</span><strong>“${esc(o.name)}”</strong><span style="color:var(--muted)">${ps.length} pieces · $${ps.reduce((s,p)=>s+p.price,0).toFixed(0)}</span><span style="font-size:12px">${ps.map(p=>`<a href="${p.url}" target="_blank" rel="noopener">${esc(p.name)} ↗</a>`).join('<br>')}</span><div class="row"><button class="split" data-split="${o.oid}">Split into pieces</button><button data-rmo="${o.oid}">Remove</button></div></div></div>`; }).join('');
    g.querySelectorAll('[data-split]').forEach(b=>b.onclick=()=>{ const o=outfits.find(x=>x.oid===b.dataset.split); o.parts.forEach(id=>{ if(!wish.some(w=>w.id===id)){ const w={id,from:'From outfit “'+o.name+'”',date:today()}; wish.push(w); syncAddPiece(w);} }); save(); toast('Added each piece to Pieces'); });
    g.querySelectorAll('[data-rmo]').forEach(b=>b.onclick=()=>{ const o=outfits.find(x=>x.oid===b.dataset.rmo); outfits=outfits.filter(x=>x!==o); syncRemoveOutfit(o); save(); renderWish(); }); } }

$('#bCopy').onclick=()=>{ const lines=['PIECES'].concat(wish.map(w=>byId(w.id)).filter(Boolean).map(p=>`${p.name} (${p.brand}) - ${CATS[p.cat]} - size ${SIZE[p.cat]} - $${p.price} - ${p.url}`),['','OUTFITS'],outfits.map(o=>`"${o.name}": `+o.parts.map(byId).filter(Boolean).map(p=>p.name).join(' + ')));
  const txt=lines.join('\n'); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Copied')).catch(()=>{ const t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select(); try{document.execCommand('copy');toast('Copied');}catch(e){} t.remove(); }); };

// ---------- create outfits ----------
let cmode=null, manualSel=[], fillGaps=true, proposals=[];
const ROLE=p=>({top:'top',knit:'top',bottom:'bottom',skirt:'bottom',dress:'dress',outer:'outer',shoe:'shoe',bag:'acc',acc:'acc'})[p.cat];
const ACCENTS=['olive','emerald','oxblood','rust','denim'];
function scoreSet(ps){ let s=0; const vib={}; ps.forEach(p=>p.vibes.forEach(v=>vib[v]=(vib[v]||0)+1)); const best=Math.max(0,...Object.values(vib)); s+=best*3;
  const acc=new Set(ps.map(p=>p.col).filter(c=>ACCENTS.includes(c))); s-= acc.size>1?(acc.size-1)*4:0;
  for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++) if(!harm(ps[i].col,ps[j].col)) s-=3;
  const cities=ps.reduce((a,p)=>a.filter(c=>p.cities.includes(c)),['la','nyc','mia']); s+=cities.length; return s+Math.random()*1.5; }
function topVibe(ps){ const vib={}; ps.forEach(p=>p.vibes.forEach(v=>vib[v]=(vib[v]||0)+1)); return Object.keys(vib).sort((a,b)=>vib[b]-vib[a])[0]||'ql'; }
function bestAdd(base,pool){ let best=null,bs=-1e9; pool.forEach(p=>{ if(base.includes(p))return; const sc=scoreSet(base.concat(p)); if(sc>bs){bs=sc;best=p;} }); return best; }
function stylist(){
  const saved=wish.map(w=>byId(w.id)).filter(Boolean); const by=r=>saved.filter(p=>ROLE(p)===r);
  const cat=r=>P.filter(p=>ROLE(p)===r);
  const bases=[]; by('dress').forEach(d=>bases.push([d]));
  by('top').forEach(t=>{ const bots=by('bottom').length?by('bottom'):(fillGaps?cat('bottom'):[]); bots.forEach(b=>bases.push([t,b])); });
  if(!by('top').length&&fillGaps) by('bottom').forEach(b=>cat('top').forEach(t=>bases.push([t,b])));
  if(!bases.length) return [];
  const cands=bases.map(base=>{ let ps=base.slice();
    const add=(r,opt)=>{ const own=by(r).filter(p=>!ps.includes(p)); let pool=own.length?own:(fillGaps&&!opt?cat(r):[]); if(!pool.length&&fillGaps&&opt&&Math.random()<0.4) pool=cat(r); if(!pool.length)return; const x=bestAdd(ps,pool); if(x&&scoreSet(ps.concat(x))>=scoreSet(ps)-3) ps.push(x); };
    add('outer',true); add('shoe',false); add('acc',true);
    return {ps,score:scoreSet(ps)-ps.filter(p=>!saved.includes(p)).length*1.5}; });
  cands.sort((a,b)=>b.score-a.score); const out=[], used=new Set();
  for(const c of cands){ const key=c.ps.slice(0,2).map(p=>p.id).join(); if(used.has(key))continue; used.add(key); out.push(c.ps); if(out.length===3)break; }
  return out.map(ps=>({ps,vibe:topVibe(ps),name:pick(NAMES[topVibe(ps)]),saved}));
}
function whyText(ps,vibe){ const cols=[...new Set(ps.map(p=>CNAME[p.col]))]; const parts=[`${VIBES[vibe]} look in ${cols.slice(0,3).join(', ').toLowerCase()}.`];
  if(ps.some(p=>ROLE(p)==='dress')) parts.push('One long line from shoulder to hem shows off your height.');
  else parts.push('Tuck the top in so your waist stays defined.');
  if(ps.some(p=>ROLE(p)==='outer')) parts.push('The jacket adds structure to your shoulders and balances your long legs.');
  if(ps.some(p=>p.col==='emerald'||p.col==='olive')) parts.push('The green brings out your eyes.');
  if(ps.some(p=>ROLE(p)==='acc')) parts.push('The accessory adds a warm, gold-toned finishing touch.');
  return parts.join(' '); }
function saveOutfitFrom(ps,name,vibe){ const o={oid:'o'+Date.now(),name:name||pick(NAMES[vibe]),vibe,parts:ps.map(p=>p.id),date:today()}; outfits.push(o); syncAddOutfit(o); save(); toast('Outfit saved'); }
function renderCreate(){ const c=$('#create'); const saved=wish.map(w=>byId(w.id)).filter(Boolean);
  let h=`<div style="margin-bottom:10px"><a href="#" id="backO" style="color:var(--camel);font-weight:700;text-decoration:none;font-size:14px">← Back to outfits</a></div>`;
  if(!cmode){ h+=`<div class="panel"><h4>Make outfits</h4><div style="font-size:13px;color:#5A4A3E;margin-bottom:12px">How do you want to make them?</div>
    <div class="mode" style="flex-direction:column"><button data-m="manual" style="padding:18px;text-align:left">Manual<br><span style="font-weight:400;font-size:12.5px">Pick the pieces yourself from what you've saved</span></button>
    <button data-m="ai" style="padding:18px;text-align:left;background:var(--esp);color:#fff">✨ Auto-style<br><span style="font-weight:400;font-size:12.5px">The stylist puts your saved pieces into outfits for you</span></button></div></div>`;
    c.innerHTML=h; wireMode(); return; }
  h+=`<div class="mode"><button data-m="ai" class="${cmode==='ai'?'on':''}">✨ Auto-style</button><button data-m="manual" class="${cmode==='manual'?'on':''}">Manual</button></div>`;
  if(!saved.length){ c.innerHTML=h+'<div class="empty">Save some pieces first, then come back here.</div>'; wireMode(); return; }
  if(cmode==='manual'){
    const sel=manualSel.map(byId).filter(Boolean);
    h+=`<div class="panel"><h4>Manual</h4><div style="font-size:13px;color:#5A4A3E">Tap the pieces you want to wear together.</div>
      ${sel.length?`<div class="prev">${gridHTML(sel.slice(0,5),false)}</div>`:''}
      <div style="font-size:13px">${sel.length} selected${sel.length?` · $${sel.reduce((s,p)=>s+p.price,0).toFixed(0)}`:''}${sel.length>5?' (preview shows 5)':''}</div>
      <input type="text" id="oname" placeholder="Name this outfit (e.g. Dinner in Miami)">
      <div style="display:flex;gap:8px"><button class="btn dark" id="msave" ${sel.length<2?'disabled style="opacity:.4"':''}>Save outfit</button><button class="btn" id="mclear">Clear</button></div></div>
      <div class="pickgrid">${saved.map(p=>`<div class="tile ${manualSel.includes(p.id)?'sel':''}" data-pid="${p.id}">${imgTag(p)}<span class="chk">✓</span><div class="lab">${esc(p.name)}</div></div>`).join('')}</div>`;
    c.innerHTML=h; wireMode();
    c.querySelectorAll('.pickgrid .tile').forEach(t=>t.onclick=()=>{ const id=t.dataset.pid; manualSel=manualSel.includes(id)?manualSel.filter(x=>x!==id):manualSel.concat(id); renderCreate(); });
    const ms=$('#msave'); if(ms) ms.onclick=()=>{ if(sel.length<2)return; saveOutfitFrom(sel,$('#oname').value.trim(),topVibe(sel)); manualSel=[]; renderCreate(); };
    $('#mclear').onclick=()=>{ manualSel=[]; renderCreate(); };
    return; }
  if(!proposals.length) proposals=stylist();
  h+=`<label class="tog"><input type="checkbox" id="fg" ${fillGaps?'checked':''}> Fill gaps with new picks (like shoes or a jacket) if my saved pieces are missing them</label>`;
  if(!proposals.length) h+='<div class="empty">I need at least a top and a bottom, or a dress, to make an outfit. Turn on “Fill gaps” or save a few more pieces.</div>';
  proposals.forEach((o,i)=>{ const savedIds=new Set(wish.map(w=>w.id));
    h+=`<div class="panel"><h4>“${esc(o.name)}”</h4><div class="brand">${VIBES[o.vibe]} · ${o.ps.length} pieces · $${o.ps.reduce((s,p)=>s+p.price,0).toFixed(0)}</div>
      <div class="prev"><div class="ogrid n${Math.min(o.ps.length,5)}">${o.ps.slice(0,5).map(p=>`<div class="tile">${imgTag(p)}${savedIds.has(p.id)?'':'<span class="sugg">NEW PICK</span>'}</div>`).join('')}</div></div>
      <div class="why2">${whyText(o.ps,o.vibe)}</div>
      <div style="font-size:12.5px;margin-bottom:10px">${o.ps.map(p=>`<a href="${p.url}" target="_blank" rel="noopener" style="color:var(--ink);text-decoration:none">${esc(p.name)} <span style="color:var(--camel)">$${p.price.toFixed(0)} ↗</span></a>${savedIds.has(p.id)?'':' <span style="color:var(--gold);font-weight:700">new</span>'}`).join('<br>')}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn dark" data-sv="${i}">♥ Save outfit</button><button class="btn" data-ed="${i}">Edit manually</button></div></div>`; });
  h+=`<div style="text-align:center"><button class="btn" id="reroll">↻ Show me different outfits</button></div>`;
  c.innerHTML=h; wireMode();
  $('#fg').onchange=e=>{ fillGaps=e.target.checked; proposals=[]; renderCreate(); };
  $('#reroll').onclick=()=>{ proposals=[]; renderCreate(); };
  c.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{ const o=proposals[+b.dataset.sv]; o.ps.forEach(p=>{ if(!wish.some(w=>w.id===p.id)){ const w={id:p.id,from:'Added by stylist for “'+o.name+'”',date:today()}; wish.push(w); syncAddPiece(w);} }); saveOutfitFrom(o.ps,o.name,o.vibe); b.textContent='Saved ✓'; b.disabled=true; });
  c.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{ const o=proposals[+b.dataset.ed]; o.ps.forEach(p=>{ if(!wish.some(w=>w.id===p.id)){ const w={id:p.id,from:'Added by stylist',date:today()}; wish.push(w); syncAddPiece(w);} }); save(); manualSel=o.ps.map(p=>p.id); cmode='manual'; renderCreate(); });
}
function wireMode(){ document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ cmode=b.dataset.m; if(cmode==='ai') proposals=[]; renderCreate(); }); const bk=$('#backO'); if(bk) bk.onclick=e=>{ e.preventDefault(); sub='outfits'; cmode=null; renderWish(); }; }

// ---------- moodboards ----------
const BOARDS=[
 {k:'ql',title:'Quiet luxury',city:'Best for NYC, also LA',text:'Tonal camel, ivory and chocolate. Long coats, cashmere, tailored wide-leg trousers, loafers.',cols:['camel','ivory','chocolate','taupe','espresso'],word:'tonal · tailored · soft',wc:'camel',q:'quiet luxury outfits women'},
 {k:'mo',title:'Model off-duty',city:'Best for NYC and LA',text:'Fitted tanks and bodysuits, straight jeans, leather jackets, boots, an oversized blazer, sunglasses.',cols:['black','chocolate','denim','espresso','ivory'],word:'black · leather · denim',wc:'black',q:'model off duty street style'},
 {k:'med',title:'Mediterranean summer',city:'Best for Miami, also LA',text:'Linen in ivory, sand and olive, silk slips, woven flats and bags, gold jewelry.',cols:['ivory','sand','olive','camel','gold'],word:'linen · sun · gold',wc:'olive',q:'mediterranean summer outfits women'},
 {k:'n90',title:'90s minimalist',city:'Works everywhere, especially evenings',text:'Bias-cut slips, silk maxi skirts, sleek black and chocolate, pointed flats, clean lines.',cols:['black','chocolate','oxblood','taupe','emerald'],word:'clean · sleek · bias-cut',wc:'chocolate',q:'90s minimalist fashion'}];
function renderBoards(){ $('#v-boards').innerHTML=BOARDS.map(b=>{ const ps=P.filter(p=>p.vibes.includes(b.k)).sort((a,c)=>(c.vibes[0]===b.k)-(a.vibes[0]===b.k)); const pk=[];
    ['outer','dress','top','bottom','shoe','acc','skirt','bag','knit','shoe','acc'].forEach(c=>{ const x=ps.find(p=>p.cat===c&&!pk.includes(p)); if(x) pk.push(x); });
    const cls=['big','tall','','','','tall','','',''];
    return `<div class="board"><h3>${b.title}</h3><p><b>${b.city}.</b> ${b.text}</p><div class="collage">${pk.slice(0,9).map((p,i)=>`<a class="${cls[i]||''}" href="${p.url}" target="_blank" rel="noopener">${imgTag(p)}</a>`).join('')}<div class="word" style="background:${COLORS[b.wc]}">${b.word}</div></div>
    <div class="swatches">${b.cols.map(c=>`<i style="background:${COLORS[c]}"></i>`).join('')}</div>
    <div class="links"><a href="https://www.pinterest.com/search/pins/?q=${encodeURIComponent(b.q)}" target="_blank" rel="noopener">More on Pinterest ↗</a><a href="#" data-swipe="${b.k}">Swipe this vibe →</a></div></div>`; }).join('');
  document.querySelectorAll('[data-swipe]').forEach(a=>a.onclick=e=>{ e.preventDefault(); filt.v=[a.dataset.swipe]; LS.set('ss3_filt',filt); renderFilters(); queue=[]; show('swipe'); render(); }); }

function show(v){ ['swipe','wish','boards'].forEach(x=>$('#v-'+x).hidden=x!==v); document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===v)); if(v==='wish')renderWish(); if(v==='boards')renderBoards(); window.scrollTo(0,0); }
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));
$('#bYes').onclick=()=>decide(true); $('#bNo').onclick=()=>decide(false); $('#bUndo').onclick=undo;
document.addEventListener('keydown',e=>{ if($('#v-swipe').hidden||e.target.tagName==='INPUT')return; if(e.key==='ArrowRight')decide(true); else if(e.key==='ArrowLeft')decide(false); else if(e.key==='Backspace'){e.preventDefault();undo();} });
renderFilters(); save(); render();
</script>
</body></html>
